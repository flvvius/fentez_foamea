name: health

on:
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Check each source ran recently
        id: check
        working-directory: packages/scrapers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run src/health-cli.ts

      - name: Catch up on missed scrapes
        if: ${{ !cancelled() && steps.check.outputs.catch_up != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CATCH_UP: ${{ steps.check.outputs.catch_up }}
        run: |
          others=""
          for source in $CATCH_UP; do
            if [ "$source" = bonapp ]; then
              gh workflow run scrape.yml --repo "${{ github.repository }}" -f sources=bonapp
            else
              others="$others $source"
            fi
          done
          if [ -n "$others" ]; then
            gh workflow run scrape.yml --repo "${{ github.repository }}" -f sources="${others# }"
          fi

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Smoke test the live site
        working-directory: apps/web
        run: bunx playwright test -c playwright.live.config.ts

  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in scrape.yml health.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$workflow/enable"
          done
